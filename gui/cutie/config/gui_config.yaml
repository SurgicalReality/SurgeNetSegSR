defaults:
  - _self_
  - model: base

# workspace configuration
workspace_root: ./workspace
image_endpoint: images
mask_endpoint: masks
vis_endpoint: vis

amp: True
weights: gui/weights/cutie-surgenetseg-50k.pth
ritm_weights: gui/weights/ritm-surgenetseg-50k.pth

# Interactive segmentation model selection
# Options: 'ritm' or 'sam2'
interactive_model: ritm

# SAM2 configuration (only used if interactive_model: sam2)
# Use an absolute path to a custom config file, OR a Hydra-relative path like 'configs/sam2.1/sam2.1_hiera_s.yaml'
sam2_config: C:\Users\Skyfinder\Projects\SurgeNetSeg\custom\sam2\sam2.1_hiera_s_512.yaml
sam2_checkpoint: C:\Users\Skyfinder\Projects\SurgeNetSeg\custom\sam2\hiera_s_mose_512_checkpoint.pt

# All "size" parameters represent the length of the shorter edge
# maximum internal processing size; reducing this speeds up processing
max_internal_size: 480

# maximum size for extracting frames; the output will also be in this size
# reducing this mainly speed up I/O
# it should not be smaller than the internal size
max_overall_size: 1080
buffer_size: 20

# we use multithreading for saving the results
save_queue_size: 20
num_save_threads: 4

# for reading
num_read_workers: 4

# for exporting video
output_fps: 24
output_bitrate: 1 # in Mbps

use_long_term: True
mem_every: 5
top_k: 30
stagger_updates: 5
chunk_size: -1 # number of objects to process in parallel; -1 means unlimited

# only relevant when long_term is not enabled
max_mem_frames: 5

# only relevant when long_term is enabled
long_term:
  count_usage: True
  max_mem_frames: 10
  min_mem_frames: 5
  num_prototypes: 128
  max_num_tokens: 10000
  buffer_tokens: 2000

save_aux: False
flip_aug: False
